        - text: Bu aydınlatma metni, 6698 sayılı Kişisel Verilerin Korunması Kanunu ("KVKK") uyarınca, veri sorumlusu sıfatıyla
        - strong [ref=f2e25]: SAGE Makine Servis Temsilcilik ve Limited Şirketi
        - text: ("SAGE Makine") tarafından hazırlanmıştır.
      - heading "1. İşlenen Kişisel Veriler ve İşleme Amaçları" [level=2] [ref=f2e26]
      - paragraph [ref=f2e27]: "Web sitemiz (sagemakine.com) üzerinde üyelik sistemi veya sunucularımızda saklanan bir iletişim formu bulunmamaktadır. Bizimle iletişime geçtiğinizde:"
      - list [ref=f2e28]:
        - listitem [ref=f2e29]:
          - strong [ref=f2e30]: "Telefon / WhatsApp:"
          - text: Ad-soyad, telefon numarası ve ilettiğiniz mesaj içeriği; talebinizi yanıtlamak, teklif hazırlamak ve satış-servis sürecini yürütmek amacıyla işlenir. WhatsApp üzerinden kurulan iletişimde veriler ayrıca WhatsApp LLC'nin hizmet şartlarına tabidir.
        - listitem [ref=f2e31]:
          - strong [ref=f2e32]: "E-posta:"
          - text: E-posta adresiniz ve mesaj içeriğiniz, talebinizin yanıtlanması ve ticari ilişkinin yürütülmesi amacıyla işlenir.
      - paragraph [ref=f2e33]: Sitemiz üçüncü taraf reklam ve takip çerezi kullanmaz. Sayfalarda gömülü Google Haritalar görüntüleyicisi, Google LLC tarafından kendi politikaları uyarınca çerez kullanabilir.
      - heading "2. İşlemenin Hukuki Sebebi" [level=2] [ref=f2e34]
      - paragraph [ref=f2e35]: Kişisel verileriniz; KVKK md. 5/2 uyarınca "bir sözleşmenin kurulması veya ifasıyla doğrudan doğruya ilgili olması" ve "veri sorumlusunun meşru menfaati" hukuki sebeplerine dayanılarak, yalnızca iletişim ve ticari ilişki yönetimi amacıyla işlenir.
      - heading "3. Verilerin Aktarılması" [level=2] [ref=f2e36]
      - paragraph [ref=f2e37]: Kişisel verileriniz; yasal yükümlülükler dışında üçüncü kişilerle paylaşılmaz, pazarlama amaçlı veri tabanlarına eklenmez ve yurt dışına aktarılmaz (WhatsApp/e-posta altyapı sağlayıcılarının kendi işleyişi hariç).
      - heading "4. Saklama Süresi" [level=2] [ref=f2e38]
      - paragraph [ref=f2e39]: Veriler, iletişim talebinin sonuçlanmasından itibaren makul süre; ticari ilişki kurulması halinde ilgili mevzuattaki zamanaşımı süreleri boyunca saklanır.
      - heading "5. KVKK Kapsamındaki Haklarınız" [level=2] [ref=f2e40]
      - paragraph [ref=f2e41]: KVKK md. 11 uyarınca; kişisel verilerinizin işlenip işlenmediğini öğrenme, işlenmişse bilgi talep etme, düzeltilmesini veya silinmesini isteme, işlemeye itiraz etme ve zarara uğramanız hâlinde giderilmesini talep etme haklarına sahipsiniz.
      - paragraph [ref=f2e42]:
        - text: Başvurularınızı
        - link "info@sagemakine.com" [ref=f2e43] [cursor=pointer]:
          - /url: mailto:info@sagemakine.com
        - text: adresine veya
        - strong [ref=f2e44]: Güzelyurt Mah. 5748 Sk. No:32 İç Kapı No:6, Yunusemre / Manisa
        - text: adresine yazılı olarak iletebilirsiniz.
