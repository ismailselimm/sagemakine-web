        - heading "X-Ray mı Metal Dedektör mü? Gıdada Yabancı Madde Tespiti" [level=1] [ref=f5e53]
        - paragraph [ref=f5e54]: Gıda üretiminde yabancı madde riski hem müşteri güvenini hem de ihracat kapılarını doğrudan etkiler. Metal dedektör ve X-Ray gıda kontrol sistemleri bu riske karşı iki farklı yaklaşım sunar; hangisinin size uygun olduğu ürününüze, ambalajınıza ve müşteri şartlarınıza bağlıdır. Bu yazıda iki teknolojiyi dürüstçe karşılaştırıyoruz.
      - generic [ref=f5e56]:
        - heading "İki Teknoloji, İki Farklı Prensip" [level=2] [ref=f5e57]
        - paragraph [ref=f5e58]: Metal dedektör, adı üstünde yalnızca metali arar. Cihazın içinden geçen ürün bir elektromanyetik alandan geçer; demir, demir dışı metal veya paslanmaz çelik bir parçacık bu alanı bozduğunda sistem sinyal üretir ve şüpheli paketi hava jeti ya da itici kol ile ıskarta tarafına ayırır. Basit, güvenilir ve on yıllardır kendini kanıtlamış bir teknolojidir; ancak metal olmayan hiçbir yabancı maddeyi göremez.
        - paragraph [ref=f5e59]: X-Ray gıda kontrol sistemi ise yoğunluk görüntüleme prensibiyle çalışır. Ürünün içinden geçen X ışınının bir kısmı ürün tarafından emilir; yoğunluğu ürünün kendisinden belirgin şekilde yüksek olan her cisim, görüntüde koyu bir nokta olarak belirir. Görüntü işleme yazılımı bu noktaları saniyeler içinde değerlendirir ve şüpheli paketi ıskartaya yönlendirir. Bu sayede metalin yanı sıra cam, taş, yoğun kemik ve yoğun plastikler de tespit edilebilir.
        - paragraph [ref=f5e60]:
          - text: "Burada önemli bir ayrım var: bu iki sistem de hat sonunda, çoğunlukla paketlenmiş ürün üzerinde çalışan son kontrol cihazlarıdır. Hat başında dökme ürünü tane tane ayıklayan"
          - link "renk ayırma makinesi" [ref=f5e61] [cursor=pointer]:
            - /url: /renk-ayirma-makinesi/
          - text: (piyasada renk ayıklama makinesi veya color sorter olarak da bilinir) ile aynı işi yapmazlar; birbirlerinin yerine değil, birbirlerini tamamlayacak şekilde konumlandırılırlar.
