        - paragraph [ref=f5e110]: "Dürüst olmak gerekirse X-Ray da her şeyi görmez: düşük yoğunluklu plastik film, saç, kıl, ahşap ve karton gibi maddeler X-Ray için de zordur. Ayrıca çok ince metal teller yönlerine bağlı olarak her iki teknolojiyi de zorlayabilir. Bu yüzden hiçbir cihaz, iyi kurgulanmış bir hijyen ve bakım programının yerini tutmaz; yalnızca onu tamamlar."
        - heading "Ne Zaman Metal Dedektör Yeterli Olur?" [level=2] [ref=f5e111]
        - paragraph [ref=f5e112]: "Her işletmenin X-Ray yatırımına ihtiyacı yoktur. Şu koşullar bir arada sağlanıyorsa metal dedektör mantıklı ve ekonomik bir çözümdür:"
        - list [ref=f5e113]:
          - listitem [ref=f5e114]:
            - strong [ref=f5e115]: "Risk yalnızca metal kaynaklı ise:"
            - text: Yabancı madde riskiniz ağırlıklı olarak hat ekipmanından (bıçak, elek teli, cıvata, kaynak çapağı) geliyorsa metal dedektör bu riski karşılar.
          - listitem [ref=f5e116]:
            - strong [ref=f5e117]: "Ambalajınız folyosuz ise:"
            - text: Şeffaf film, PET veya karton ambalajda metal dedektör rahat çalışır. Alüminyum folyo veya metalize film kullanıyorsanız durum değişir; folyo için geliştirilen özel dedektörler yalnızca demir içeren metalleri görebilir.
          - listitem [ref=f5e118]:
            - strong [ref=f5e119]: "Bütçe kısıtlı ise:"
            - text: Metal dedektörün hem yatırım hem işletme maliyeti belirgin şekilde düşüktür, lisans gerektirmez ve operatör eğitimi kısadır.
        - heading "Ne Zaman X-Ray Şart?" [level=2] [ref=f5e120]
        - paragraph [ref=f5e121]:
          - text: Bazı senaryolarda ise
          - link "X-Ray gıda kontrol makinesi" [ref=f5e122] [cursor=pointer]:
            - /url: /x-ray-gida-kontrol-makinesi/
          - text: "tercih değil, zorunluluktur:"
        - list [ref=f5e123]:
          - listitem [ref=f5e124]:
            - strong [ref=f5e125]: "Cam, taş ve kemik riski varsa:"
            - text: Cam kavanoza dolum yapıyorsanız cam kırığını ancak X-Ray görür. Tarladan gelen üründe (bakliyat, kuruyemiş, kuru meyve) taş riski hiçbir zaman sıfırlanamaz; hat başındaki ayıklama ne kadar iyi olursa olsun son kontrol X-Ray ile yapılır.
          - listitem [ref=f5e126]:
            - strong [ref=f5e127]: "Folyolu veya metalize ambalaj kullanıyorsanız:"
            - text: Metal dedektörün kör kaldığı bu ambalajlarda X-Ray, folyonun içindeki metali dahi tespit eder.
          - listitem [ref=f5e128]:
            - strong [ref=f5e129]: "BRC, IFS veya müşteri şartı varsa:"
            - text: Büyük perakende zincirleri ve Avrupa alıcıları, tedarikçi denetimlerinde giderek daha sık X-Ray kontrolü talep ediyor. Özellikle
            - link "kuru meyve" [ref=f5e130] [cursor=pointer]:
              - /url: /sektorler/kuru-meyve/
            - text: ve
            - link "kuruyemiş" [ref=f5e131] [cursor=pointer]:
              - /url: /sektorler/kuruyemis/
            - text: ihracatında X-Ray, denetim raporunda güçlü bir güvence maddesidir.
        - paragraph [ref=f5e132]: "X-Ray tarafında bilinmesi gereken bir konu da lisanstır: Türkiye'de X-Ray cihazı işletmek için Nükleer Düzenleme Kurumu (NDK) lisansı alınması gerekir. Süreç düzgün yürütüldüğünde bir engel değildir; kurulum öncesinde planlamaya dahil edilmesi yeterlidir."
        - heading "İkisi Birlikte Ne Zaman Mantıklı?" [level=2] [ref=f5e133]
        - paragraph [ref=f5e134]: Orta ve büyük ölçekli tesislerde en sağlıklı kurgu çoğu zaman ikisinin birlikte kullanılmasıdır. Metal dedektörler, proses içindeki ara noktalarda (değirmen, kıyıcı, dolum makinesi öncesi) hem ekipmanı korur hem de metali kaynağına yakın yakalar; böylece sorunlu partinin tamamı hat sonuna ulaşmadan tespit edilir. X-Ray ise hat sonunda, paketlenmiş ürün üzerinde cam, taş, kemik ve metali kapsayan nihai kontrolü yapar. Bu kurguda iki teknoloji birbirinin eksiğini kapatır ve yabancı madde kaynaklı iade riski en aza iner.
        - heading "SAGE Makine Yaklaşımı" [level=2] [ref=f5e135]
        - paragraph [ref=f5e136]: "Yirmi iki yıllık saha tecrübemizde şunu net gördük: doğru cevap her tesiste aynı değildir. İhtiyacınız yalnızca metal dedektörle çözülüyorsa bunu açıkça söyleriz; cam, taş ve folyolu ambalaj riskiniz varsa X-Ray gıda kontrol ve gerekiyorsa hat başı renk ayırma makinesi ile bütünsel bir kurgu öneririz. Kendi ürününüzü, kendi yabancı madde örneklerinizle test etmek isterseniz numune testi ve teklif için bize ulaşmanız yeterli."
