<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .ink { fill: #16283f; }
    .ink-soft { fill: #1e3a5f; }
    .ink-top { fill: #223850; }
    .line { stroke: #16283f; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #ffffff; }
      .ink-soft { fill: #c9d4de; }
      .ink-top { fill: #8ba0b4; }
      .line { stroke: #ffffff; }
    }
  </style>
  <!-- ayıklama kafası -->
  <polygon class="ink-top" points="36,14 64,4 92,14 64,24"/>
  <polygon class="ink" points="36,14 64,24 64,54 36,44"/>
  <polygon class="ink-soft" points="64,24 92,14 92,44 64,54"/>
  <!-- mercek -->
  <ellipse cx="64" cy="62" rx="15" ry="5.5" fill="none" stroke="#7aab35" stroke-width="4"/>
  <ellipse cx="64" cy="62" rx="6.5" ry="2.4" fill="#7aab35"/>
  <!-- püskürtme -->
  <g stroke="#7aab35" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 7.5">
    <line x1="64" y1="70" x2="34" y2="98" opacity="0.55"/>
    <line x1="64" y1="70" x2="49" y2="99" opacity="0.75"/>
    <line x1="64" y1="70" x2="64" y2="100" opacity="0.95"/>
    <line x1="64" y1="70" x2="79" y2="99" opacity="0.75"/>
    <line x1="64" y1="70" x2="94" y2="98" opacity="0.55"/>
  </g>
  <!-- konveyör + taneler -->
  <line class="line" x1="8" y1="112" x2="120" y2="112" stroke-width="4" stroke-linecap="round"/>
  <circle cx="24" cy="105" r="6.5" fill="#7aab35"/>
  <circle cx="44" cy="105" r="6.5" fill="#5c8a3a"/>
  <circle cx="64" cy="105" r="6.5" fill="#46687a"/>
  <circle cx="84" cy="105" r="6.5" fill="#2f4a63"/>
  <circle cx="104" cy="105" r="6.5" class="ink"/>
</svg>
